<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
	<title>影盒 · 手机助手</title>
	<link rel="stylesheet" type="text/css" href="yhg.css">
</head>

<body>
	<div class="page">
		<div class="page__bd">

			<!-- ── 页面 1：搜索 ── -->
			<section class="yhg-view" id="viewSearch">
				<h2 class="yhg-view__title">搜索</h2>

				<div class="search-bar">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="11" cy="11" r="7" />
						<path d="M20 20l-3.6-3.6" />
					</svg>
					<input id="search_key_word" type="text" value="" placeholder="想看什么，输就完了"
						autocomplete="off" />
					<button class="sb-clear" onclick="$('#search_key_word').val('').focus(); return false;"
						aria-label="清空">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
							stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="8" fill="rgba(255,255,255,0.14)" stroke="none" />
							<path d="M9.5 9.5l5 5M14.5 9.5l-5 5" />
						</svg>
					</button>
				</div>

				<p class="yhg-hint">按键盘上的「搜索 / 换行」键，结果会直接在电视上打开。</p>

				<div class="yhg-history" id="searchHistory">
					<div class="yhg-history__hd">
						<span>最近搜索</span>
						<button id="hisClear" type="button">清空</button>
					</div>
					<div class="yhg-history__chips" id="hisChips"></div>
				</div>
			</section>

			<!-- ── 页面 2：推送 ── -->
			<section class="yhg-view" id="viewPush">
				<h2 class="yhg-view__title">推送播放</h2>

				<div class="search-bar">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M12 4v10" />
						<path d="M8 10.5l4 4 4-4" />
						<path d="M5 18.5h14" />
					</svg>
					<input id="push_url" type="text" value="" placeholder="粘贴视频 / 直播 / 磁力地址"
						autocomplete="off" />
					<button class="sb-clear" onclick="$('#push_url').val('').focus(); return false;" aria-label="清空">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
							stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="8" fill="rgba(255,255,255,0.14)" stroke="none" />
							<path d="M9.5 9.5l5 5M14.5 9.5l-5 5" />
						</svg>
					</button>
				</div>

				<button onclick="push(); return false;" class="yhg-btn-primary">推送到电视</button>

				<p class="yhg-hint">按键盘上的「换行」键也能直接推送。</p>
			</section>

			<!-- ── 页面 3：配置 ── -->
			<section class="yhg-view" id="viewConfig">
				<h2 class="yhg-view__title">配置</h2>

				<div class="search-bar">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
						stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M9.5 4.5h5l1 2.5H20a1 1 0 0 1 1 1V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V8a1 1 0 0 1 1-1h4.5z" />
						<circle cx="12" cy="13" r="3.2" />
					</svg>
					<input id="diy_api_url" type="text" value="" placeholder="粘贴数据源配置地址" autocomplete="off" />
				</div>

				<button onclick="api(); return false;" class="yhg-btn-primary">立即生效</button>

				<div class="yhg-group-hd" onclick="toggleAdv()">
					<span>高级选项</span>
					<span class="yhg-group-hd__sub">直播源 · EPG · 代理</span>
					<svg class="yhg-chev" id="advChev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
						<path d="M6 9.5l6 6 6-6" />
					</svg>
				</div>

				<div class="yhg-adv" id="advBody">
					<div class="adv-row">
						<input id="diy_live_url" type="text" value="" placeholder="直播源地址" autocomplete="off" />
						<button onclick="live(); return false;">确定</button>
					</div>
					<div class="adv-row">
						<input id="diy_epg_url" type="text" value="" placeholder="直播 EPG 地址" autocomplete="off" />
						<button onclick="epg(); return false;">确定</button>
					</div>
					<div class="adv-row">
						<input id="diy_proxy_server" type="text" value="" placeholder="socks 代理 IP:端口"
							autocomplete="off" />
						<button onclick="proxys(); return false;">确定</button>
					</div>
				</div>

				<p class="yhg-hint">配置地址也可以在电视端「设置 → 配置接口」里切换。</p>
			</section>
		</div>
	</div>

	<!-- 液态玻璃导航栏 -->
	<nav class="lg-dock" role="tablist">
		<div class="lg-dock__item" id="dockSearch" role="tab" aria-selected="false" onclick="switchView('Search')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
				stroke-linecap="round" stroke-linejoin="round">
				<circle cx="11" cy="11" r="7" />
				<path d="M20 20l-3.6-3.6" />
			</svg>
			<p>搜索</p>
		</div>
		<div class="lg-dock__item" id="dockPush" role="tab" aria-selected="false" onclick="switchView('Push')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
				stroke-linecap="round" stroke-linejoin="round">
				<path d="M12 4v10" />
				<path d="M8 10.5l4 4 4-4" />
				<path d="M5 18.5h14" />
			</svg>
			<p>推送</p>
		</div>
		<div class="lg-dock__item is-on" id="dockConfig" role="tab" aria-selected="true" onclick="switchView('Config')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
				stroke-linecap="round" stroke-linejoin="round">
				<path
					d="M9.5 4.5h5l1 2.5H20a1 1 0 0 1 1 1V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V8a1 1 0 0 1 1-1h4.5z" />
				<circle cx="12" cy="13" r="3.2" />
			</svg>
			<p>配置</p>
		</div>
	</nav>

	<div role="alert" id="warnToast" style="display: none;">
		<div class="weui-mask_transparent"></div>
		<div class="yhg-toast" id="warnToastBox">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
				stroke-linejoin="round">
				<circle cx="12" cy="12" r="9" />
				<path d="M12 7.5v5.5" />
				<path d="M12 16.4v.2" />
			</svg>
			<p class="yhg-toast__content" id="warnToastContent"></p>
		</div>
	</div>

	<script src="jquery.js"></script>
	<script src="script.js"></script>
</body>

</html>
